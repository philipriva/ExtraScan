name: ETF Leaders to QQscan G+H

# G: yellowETF∪whiteETF ETF tickers always + holdings that pass filter → QQscan column G.
# H: yellowALL+whiteballALL union → QQscan column H (Sheets-only, no Schwab).
# Reuses GOOGLE_SERVICE_ACCOUNT_JSON. Does not touch Fund Flow tabs / QQscan A·J.
# Stops writing F (prior F left uncleared).
#
# Triggers (belt + suspenders + after Fund Flow):
# 1) workflow_run — after Daily ExtraScan succeeds (fresh yellow/white + ALL)
# 2) schedule primary/backup — GitHub UTC cron (can delay/skip after YAML churn)
# 3) workflow_dispatch — manual / API
#
# Scheduler resync: 2026-10-23 — G/H retarget after Philip request.
# Avoid colliding Fund Flow 15 20 and QQscan 30 2 / 15 4.
on:
  workflow_run:
    workflows: ["Daily ExtraScan"]
    types: [completed]
  schedule:
    # Primary: 0 3 * * 2-6 ≈ 11:00 HKT Tue–Sat (~30 min after QQscan A/J primary).
    - cron: "0 3 * * 2-6"
    # Backup:  30 5 * * 2-6 ≈ 14:30 JST Tue–Sat (after QQscan backup 15 4;
    #          far from Fund Flow 15 20 UTC).
    - cron: "30 5 * * 2-6"
    # Pre-11:00 backups (Philip t337u), odd minutes, ~2–7 min job:
    # 09:11 JST Tue–Sat; 10:23 JST Tue–Sat. Skip if workflow_run already wrote.
    - cron: "11 0 * * 2-6"
    - cron: "23 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: etf-leaders-qqscan-gh
  cancel-in-progress: false

jobs:
  etf-leaders:
    # Skip failed/cancelled Daily ExtraScan; still run on schedule + dispatch.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Skip if session already succeeded
        id: already
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 skip_if_session_done.py --workflow etf_leaders.yml
      - uses: actions/setup-python@v5
        if: steps.already.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.already.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Scan → QQscan G + H
        if: steps.already.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "upstream=${{ github.event.workflow_run.name }} conclusion=${{ github.event.workflow_run.conclusion }} run_id=${{ github.event.workflow_run.id }}"
          fi
          python write_etf_leaders.py
