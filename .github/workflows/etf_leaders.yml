name: ETF Leaders to QQscan G+H

# G: yellowETF∪whiteETF ETF tickers always + holdings that pass filter → QQscan column G.
# H: yellowALL+whiteballALL union → QQscan column H (Sheets-only, no Schwab).
# Reuses GOOGLE_SERVICE_ACCOUNT_JSON. Does not touch Fund Flow tabs / QQscan A·J.
# Stops writing F (prior F left uncleared).
#
# Triggers (belt + suspenders + after Fund Flow):
# 1) workflow_run — after Daily ExtraScan succeeds (fresh yellow/white + ALL)
# 2) schedule primary/backup — GitHub UTC cron (can delay/skip after YAML churn)
# 3) workflow_dispatch — manual / API
#
# Scheduler resync: 2026-10-23 — G/H retarget after Philip request.
# Avoid colliding Fund Flow 15 20 and QQscan 30 2 / 15 4.
on:
  workflow_run:
    workflows: ["Daily ExtraScan"]
    types: [completed]
  schedule:
# Primary trigger is the 07:30 JST routine (workflow_dispatch), approved
# 2026-11-17 (Philip / 指原). GitHub schedule is a midday backup only:
# odd minutes, Tue–Sat, staggered so writers do not share a Yahoo pull.
# Skip-if-session-already-succeeded makes this a no-op after a successful
# morning run. Morning crons added 2026-11-26 (Philip decoupling decision):
# an independent trigger layer only — GitHub schedule has no SLA, so the
# routine dispatch remains the punctuality guarantee.
    # Morning trigger: 07:13 JST Tue–Sat = `13 22 * * 1-5` UTC.
    - cron: "13 22 * * 1-5"
    # Midday backup: 12:53 JST Tue–Sat (also workflow_run after Daily) = `53 3 * * 2-6` UTC.
    - cron: "53 3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: etf-leaders-qqscan-gh
  cancel-in-progress: false

jobs:
  etf-leaders:
    # Skip failed/cancelled Daily ExtraScan; still run on schedule + dispatch.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Skip if session already succeeded
        id: already
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 skip_if_session_done.py --workflow etf_leaders.yml
      - uses: actions/setup-python@v5
        if: steps.already.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.already.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Scan → QQscan G + H
        if: steps.already.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "upstream=${{ github.event.workflow_run.name }} conclusion=${{ github.event.workflow_run.conclusion }} run_id=${{ github.event.workflow_run.id }}"
          fi
          python write_etf_leaders.py
