name: QQscan CDEF tests

# Unit tests only (no secrets, no Sheet writes). Runs on PRs / pushes touching
# the new QQscan C/D/E/F writer. NEW WORKFLOW — needs Philip's authorization.
on:
  pull_request:
    paths:
      - "write_qqscan_cdef.py"
      - "marketdata.py"
      - "run_extrascan.py"
      - "write_zhuli_lm.py"
      - "write_pulse_events.py"
      - "write_etf_leaders.py"
      - "skip_if_session_done.py"
      - "tests/**"
      - ".github/workflows/qqscan_cdef*.yml"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
