name: Unit tests (offline)

# Offline only — no Google credentials, no Sheet writes, no production dispatches.
# Safe on pull_request / push to feature branches. Production write workflows do
# NOT use push/pull_request triggers.
on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q .
      - name: Unit tests
        env:
          # Ensure no accidental Sheet writes even if a test forgets to mock.
          GOOGLE_SERVICE_ACCOUNT_JSON: ""
        run: python -m unittest discover -s tests -v
