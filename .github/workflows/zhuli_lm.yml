name: Zhuli L+M to QQscan

# L: weekly 主力做多上穿做空 → QQscan!L
# M: daily  主力做多上穿做空 → QQscan!M
# Shared filters: mcap>100M, vol>300k, close>$5, daily close>EMA200
# Universe: US ex-ETF/fund (same as yellowALL). One download pass.
# Reuses GOOGLE_SERVICE_ACCOUNT_JSON. Does not touch A/G/H/J or Fund Flow tabs.
#
# Schedule: after Daily ExtraScan + CDEF (workflow_run ~07:05 JST).
# Staggered vs other full-universe Yahoo writers. Avoid Fund Flow 15 20 UTC.
on:
  schedule:
    # Primary: 33 23 * * 1-5 ≈ 08:33 JST Tue–Sat (after CDEF ~07:05–07:40).
    - cron: "33 23 * * 1-5"
    # Mid backups, ~35 min job, offset from CDEF/us-exclude/Strong:
    # 11:23 JST; 12:18 JST; 13:42 JST Tue–Sat.
    - cron: "23 2 * * 2-6"
    - cron: "18 3 * * 2-6"
    - cron: "42 4 * * 2-6"
    # Late backup 17:02 JST Tue–Sat (after CDEF late 16:22 in the 15:00 ladder).
    - cron: "2 8 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zhuli-lm-qqscan
  cancel-in-progress: false

jobs:
  zhuli-lm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Skip if session already succeeded
        id: already
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 skip_if_session_done.py --workflow zhuli_lm.yml
      - uses: actions/setup-python@v5
        if: steps.already.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.already.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Screen → QQscan L + M
        if: steps.already.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          python write_zhuli_lm.py
      - name: Upload artifact
        if: always() && steps.already.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zhuli_lm_log
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
