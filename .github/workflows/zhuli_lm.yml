name: Zhuli L+M to QQscan

# L: weekly 主力做多上穿做空 → QQscan!L
# M: daily  主力做多上穿做空 → QQscan!M
# Shared filters: mcap>100M, vol>300k, close>$5, daily close>EMA200
# Universe: US ex-ETF/fund (same as yellowALL). One download pass.
# Reuses GOOGLE_SERVICE_ACCOUNT_JSON. Does not touch A/G/H/J or Fund Flow tabs.
#
# Schedule: after US cash settle (EDT close+~1h45). Backup overnight.
# Avoid colliding Fund Flow 15 20 and QQscan A/J 30 2 / 15 4.
on:
  schedule:
# Primary trigger is the 07:30 JST routine (workflow_dispatch), approved
# 2026-11-17 (Philip / 指原). Morning crons are an independent trigger
# layer approved by Philip 2026-11-26, not the sole clock; the dispatcher
# remains the timing guarantee. Midday backup cron is retained.
# Odd minutes, Tue–Sat, staggered so writers do not share a Yahoo pull.
# Skip-if-session-already-succeeded makes a later schedule trigger a no-op
# after a successful run. GitHub schedule has no SLA.
    # Morning trigger: 08:57 JST Tue–Sat = `57 23 * * 1-5` UTC.
    - cron: "57 23 * * 1-5"
    # Midday backup: 13:07 JST Tue–Sat = `7 4 * * 2-6` UTC.
    - cron: "7 4 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zhuli-lm-qqscan
  cancel-in-progress: false

jobs:
  zhuli-lm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Skip if session already succeeded
        id: already
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 skip_if_session_done.py --workflow zhuli_lm.yml
      - uses: actions/setup-python@v5
        if: steps.already.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.already.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Screen → QQscan L + M
        if: steps.already.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          python write_zhuli_lm.py
      - name: Upload artifact
        if: always() && steps.already.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zhuli_lm_log
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
