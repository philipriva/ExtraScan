name: QQscan to Sheet

# Separate from Daily ExtraScan screen job — only fetches txt + writes QQscan A/J.
#
# Triggers (belt + suspenders + file-driven):
# 1) schedule primary/backup — GitHub UTC cron (can delay/skip after YAML churn)
# 2) workflow_dispatch — manual / API
# 3) repository_dispatch strong-stocks-updated — my-stock-scanner after Strong_Stocks_V3_*.txt
# 4) repository_dispatch maggiestocks-updated — Q-scanner after Maggiestocks_*.txt
#    (both need EXTRASCAN_DISPATCH_TOKEN on the source repo)
#
# Scheduler resync: 2026-10-23 — comment bump to re-register crons after YAML churn skips.
on:
  schedule:
    # GitHub Actions cron is UTC only (no CRON_TZ). Schedules can delay or skip a day;
    # keep a primary + backup so a miss does not leave Sheet on yesterday's Strong_Stocks.
    #
    # Upstream: Q-scanner Maggiestocks_YYYYMMDD + my-stock-scanner Strong_Stocks_V3
    # typically land ~01:40–01:52 UTC (~09:40–09:52 HKT).
    # Old "0 22 * * 1-5" raced ahead of those publishes and wrote yesterday's files.
    #
    # Primary: 0 1 * * 2-6 ≈ 10:00 JST Tue–Sat (Sheet deadline 11:00 JST).
    # Backup:  15 4 * * 2-6 ≈ 13:15 JST (catch miss; may be after 11:00 deadline).
    # File-driven: Strong + Maggie repository_dispatch write A/J when upstream lands.
    # Do NOT slide primary later to 02:30 UTC — that breaks the 11:00 JST Sheet deadline.
    # write_qqscan refuses prior-batch filenames (UPSTREAM_PENDING) instead of waiting.
    - cron: "0 1 * * 2-6"
    - cron: "15 4 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch newest Strong/Maggie only; do not write Sheet"
        type: boolean
        default: false
  repository_dispatch:
    # my-stock-scanner → strong-stocks-updated after Strong_Stocks_V3_*.txt
    # Q-scanner → maggiestocks-updated after Maggiestocks_*.txt (needs same PAT secret)
    types: [strong-stocks-updated, maggiestocks-updated]

concurrency:
  group: qqscan-sheet
  cancel-in-progress: false

jobs:
  qqscan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Write QQscan A + J
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No polling sleep: fail UPSTREAM_PENDING if session+1 files missing.
          # repository_dispatch + backup cron catch late Strong/Maggie publishes.
          QQSCAN_WAIT_SECS: "0"
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          echo "event=${{ github.event_name }} dry_run=${{ inputs.dry_run || 'n/a' }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "dispatch_file=${{ github.event.client_payload.file || '' }}"
          fi
          python write_qqscan.py "${EXTRA[@]}"
      - name: Upload verify metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqscan_verify
          path: |
            out/qqscan_verify.json
          if-no-files-found: ignore
          retention-days: 14

