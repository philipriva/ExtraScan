name: QQscan to Sheet

# Separate from Daily ExtraScan screen job — only fetches txt + writes QQscan A/J.
on:
  schedule:
    # GitHub Actions cron is UTC only (no CRON_TZ).
    # Must run AFTER Q-scanner Maggiestocks_YYYYMMDD + my-stock-scanner Strong_Stocks_V3
    # typically land (~01:52 UTC / ~09:52 HKT). Old "0 22 * * 1-5" was US close+2h but
    # raced ahead of those publishes and wrote yesterday's files.
    # 3 2 left only ~11 min after Maggie; widen to 30 2 (~38 min buffer).
    # 30 2 * * 2-6 ≈ 10:30 HKT Tue–Sat (covers Mon–Fri US sessions).
    - cron: "30 2 * * 2-6"
  workflow_dispatch:

jobs:
  qqscan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Write QQscan A + J
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python write_qqscan.py
