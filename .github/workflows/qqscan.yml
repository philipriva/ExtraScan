name: QQscan to Sheet

# Separate from Daily ExtraScan screen job — only fetches txt + writes QQscan A/J.
#
# Triggers (belt + suspenders + file-driven):
# 1) schedule primary/backup — GitHub UTC cron (can delay/skip after YAML churn)
# 2) workflow_dispatch — manual / API
# 3) repository_dispatch type strong-stocks-updated — fired by my-stock-scanner
#    after it publishes a new Strong_Stocks_V3_YYYYMMDD.txt (needs secret there)
#
# Scheduler resync: 2026-10-22 — disable/enable after this push if schedules stay quiet.
on:
  schedule:
    # GitHub Actions cron is UTC only (no CRON_TZ). Schedules can delay or skip a day;
    # keep a primary + backup so a miss does not leave Sheet on yesterday's Strong_Stocks.
    #
    # Upstream: Q-scanner Maggiestocks_YYYYMMDD + my-stock-scanner Strong_Stocks_V3
    # typically land ~01:40–01:52 UTC (~09:40–09:52 HKT).
    # Old "0 22 * * 1-5" raced ahead of those publishes and wrote yesterday's files.
    #
    # Primary: 30 2 * * 2-6 ≈ 10:30 HKT Tue–Sat (~38 min after typical publish).
    # Backup:  15 4 * * 2-6 ≈ 12:15 HKT Tue–Sat (catch skipped/delayed primary;
    #          still far from Fund Flow ExtraScan at 15 20 * * 1-5 UTC).
    - cron: "30 2 * * 2-6"
    - cron: "15 4 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch newest Strong/Maggie only; do not write Sheet"
        type: boolean
        default: false
  repository_dispatch:
    # my-stock-scanner posts this after pushing Strong_Stocks_V3_*.txt
    types: [strong-stocks-updated]

concurrency:
  group: qqscan-sheet
  cancel-in-progress: false

jobs:
  qqscan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Write QQscan A + J
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Wait up to 15 min for dated files. Strong repository_dispatch often fires
          # a few minutes before Maggiestocks_YYYYMMDD lands; write_qqscan requires
          # Maggie date >= Strong date so it polls instead of writing yesterday's J.
          # Backup cron (04:15 UTC) is a second catch if wait still expires.
          QQSCAN_WAIT_SECS: "900"
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          echo "event=${{ github.event_name }} dry_run=${{ inputs.dry_run || 'n/a' }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "dispatch_file=${{ github.event.client_payload.file || '' }}"
          fi
          python write_qqscan.py "${EXTRA[@]}"
