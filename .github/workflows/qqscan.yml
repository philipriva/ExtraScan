name: QQscan to Sheet

# Separate from Daily ExtraScan screen job — only fetches txt + writes QQscan A/J.
#
# Triggers (belt + suspenders + file-driven):
# 1) schedule primary/backup — GitHub UTC cron (can delay/skip after YAML churn)
# 2) workflow_dispatch — manual / API
# 3) repository_dispatch strong-stocks-updated — my-stock-scanner after Strong_Stocks_V3_*.txt
# 4) repository_dispatch maggiestocks-updated — Q-scanner after Maggiestocks_*.txt
#    (both need EXTRASCAN_DISPATCH_TOKEN on the source repo)
#
# Scheduler resync: 2026-10-23 — comment bump to re-register crons after YAML churn skips.
on:
  schedule:
    # GitHub Actions cron is UTC only (no CRON_TZ). Schedules can delay or skip a day;
    # keep a primary + backup so a miss does not leave Sheet on yesterday's Strong_Stocks.
    #
    # Upstream: Strong primary 09:53 JST, Maggie 10:33 JST (staggered Yahoo ladder).
    # Cron must not write A/J before both files exist for the session.
    # File-driven: Strong + Maggie repository_dispatch still write A/J without
    # waiting on cron (QQscan after both succeed is the preferred path).
    #
    # Primary: 15 2 * * 2-6 ≈ 11:15 JST Tue–Sat (after Maggie ~10:33–11:05).
    # Mid:     47 2 * * 2-6 ≈ 11:47 JST. Backup: 15 4 * * 2-6 ≈ 13:15 JST
    #          (still far from Fund Flow ExtraScan at 15 20 * * 1-5 UTC).
    - cron: "15 2 * * 2-6"
    - cron: "47 2 * * 2-6"
    - cron: "15 4 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch newest Strong/Maggie only; do not write Sheet"
        type: boolean
        default: false
  repository_dispatch:
    # my-stock-scanner → strong-stocks-updated after Strong_Stocks_V3_*.txt
    # Q-scanner → maggiestocks-updated after Maggiestocks_*.txt (needs same PAT secret)
    types: [strong-stocks-updated, maggiestocks-updated]

permissions:
  contents: read
  actions: read

concurrency:
  group: qqscan-sheet
  cancel-in-progress: false

jobs:
  qqscan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Skip if session already succeeded
        id: already
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 skip_if_session_done.py --workflow qqscan.yml
      - uses: actions/setup-python@v5
        if: steps.already.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.already.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Write QQscan A + J
        if: steps.already.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Wait up to 15 min for dated files. write_qqscan writes column A as soon as
          # Strong is fresh, then polls for Maggiestocks date >= Strong date (so J is not
          # yesterday). Maggiestocks repository_dispatch / backup cron catch late J.
          QQSCAN_WAIT_SECS: "900"
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          echo "event=${{ github.event_name }} dry_run=${{ inputs.dry_run || 'n/a' }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "dispatch_file=${{ github.event.client_payload.file || '' }}"
          fi
          python write_qqscan.py "${EXTRA[@]}"
