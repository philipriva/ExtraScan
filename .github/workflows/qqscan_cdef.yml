name: QQscan C D E F

# C: TD賣出9 ETF ∪ holdings leaders   D: TD買入1 ETF ∪ holdings leaders
# E: 全美股 ex-ETF/fund 日線主力做多上穿做空   F: 日線主力上穿 ETF ∪ holdings leaders
# Writes ONLY QQscan C/D/E/F. Does not touch A/G/H/J/L/M or Fund Flow tabs.
# Fail-closed: last bar must be last complete US session; fresh/universe >= .90.
#
# Triggers (Philip 2026-11-17):
# 1) workflow_dispatch — 07:30 JST routine primary, after us-exclude, not
#    immediately after Daily (a workflow_run hook would overlap Zhuli/Pulse
#    Yahoo pulls). Default dry_run=false, all C,D,E,F.
# 2) schedule — midday backup only (see on.schedule). Passes
#    --skip-if-primary-done so a successful morning run is a no-op.
# 3) workflow_run after Daily ExtraScan was removed so CDEF does not jump
#    the staggered dispatch queue.
# Freshness/.90 guard unchanged: stale → that group is not written (old values
# kept), run fails (exit 3).
# concurrency group qqscan-cdef (cancel-in-progress: false).
on:
  schedule:
# Primary trigger is the 07:30 JST routine (workflow_dispatch), approved
# 2026-11-17 (Philip / 指原). GitHub schedule is a midday backup only:
# odd minutes, Tue–Sat, staggered so writers do not share a Yahoo pull.
# Skip-if-session-already-succeeded makes this a no-op after a successful
# morning run. Morning crons added 2026-11-26 (Philip decoupling decision):
# an independent trigger layer only — GitHub schedule has no SLA, so the
# routine dispatch remains the punctuality guarantee.
    # Morning trigger: 08:03 JST Tue–Sat = `3 23 * * 1-5` UTC.
    - cron: "3 23 * * 1-5"
    # Midday backup: 14:07 JST Tue–Sat = `7 5 * * 2-6` UTC.
    - cron: "7 5 * * 2-6"
  workflow_dispatch:
    inputs:
      columns:
        description: "Subset of C,D,E,F"
        default: "C,D,E,F"
      dry_run:
        description: "Compute only; do not write Sheet"
        type: boolean
        default: false
      data_source:
        description: "yahoo (default, unchanged) | store (read Drive OHLCV store; Yahoo only for tickers absent from store)"
        type: choice
        options:
          - yahoo
          - store
        default: yahoo
      asof:
        description: "YYYY-MM-DD target session (dry_run only; blank = last complete session)"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  # Live runs keep the exact group "qqscan-cdef". Dry-run dispatches never write,
  # so they use their own group and cannot delay a live/recovery run.
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'qqscan-cdef-dryrun' || 'qqscan-cdef' }}
  cancel-in-progress: false

jobs:
  cdef:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Install store deps (store mode only)
        if: github.event_name == 'workflow_dispatch' && inputs.data_source == 'store'
        run: pip install pyarrow==26.0.1 google-api-python-client==2.202.0
      - name: Screen → QQscan C/D/E/F
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          ASOF_INPUT: ${{ inputs.asof }}
        run: |
          set -euo pipefail
          EXTRA=()
          COLS="C,D,E,F"
          echo "event=${{ github.event_name }} schedule='${{ github.event.schedule }}'"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COLS="${{ inputs.columns }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA+=(--dry-run); fi
            if [ "${{ inputs.data_source }}" = "store" ]; then EXTRA+=(--data-source store); fi
            if [ -n "${ASOF_INPUT:-}" ]; then EXTRA+=(--asof "$ASOF_INPUT"); fi
          fi
          # Midday backup skips if this session was already written.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EXTRA+=(--skip-if-primary-done)
          fi
          python write_qqscan_cdef.py --columns "$COLS" --out-json cdef_result.json "${EXTRA[@]}"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqscan_cdef_result
          path: cdef_result.json
          if-no-files-found: ignore
          retention-days: 14
