name: QQscan C D E F

# C: TD賣出9 ETF ∪ holdings leaders   D: TD買入1 ETF ∪ holdings leaders
# E: 全美股 ex-ETF/fund 日線主力做多上穿做空   F: 日線主力上穿 ETF ∪ holdings leaders
# Writes ONLY QQscan C/D/E/F. Does not touch A/G/H/J/L/M or Fund Flow tabs.
# Fail-closed: last bar must be last complete US session; fresh/universe >= .90.
#
# Triggers (Philip 2026-11-12 t336u: daily CDEF without manual backup dispatch):
# 1) workflow_run — after Daily ExtraScan succeeds (same pattern as ETF Leaders G+H).
#    Behaves as a primary: always writes (dry_run=false, all C,D,E,F).
# 2) schedule primary/backup — GitHub UTC cron (can delay/skip after YAML churn).
# 3) workflow_dispatch — manual / API (default dry_run=true).
#
# Schedule approved by Philip 2026-11-10 (t328u). GitHub cron is UTC.
#   Primary: 0 22 * * 1-5  ≈ 07:00 JST Tue–Sat (US close + 1–2h)
#   Extra backups (Philip t337u), odd minutes, finish before 11:00 JST (~35 min):
#     53 23 * * 1-5 ≈ 08:53 JST Tue–Sat; 47 0 * * 2-6 ≈ 09:47 JST Tue–Sat.
#   Late backup: 45 1 * * 2-6 ≈ 10:45 JST Tue–Sat (may finish after 11:00).
# All schedule crons and workflow_run pass --skip-if-primary-done. Skip if a
# schedule or workflow_run already succeeded for the session. Manual dispatch
# is unchanged (default dry_run=true).
# Freshness/.90 guard unchanged: stale → that group is not written (old values
# kept), run fails (exit 3).
# concurrency group qqscan-cdef (cancel-in-progress: false) queues overlapping
# workflow_run + cron so they do not write at the same time.
on:
  workflow_run:
    workflows: ["Daily ExtraScan"]
    types: [completed]
  schedule:
    - cron: "0 22 * * 1-5"
    - cron: "53 23 * * 1-5"
    - cron: "47 0 * * 2-6"
    - cron: "45 1 * * 2-6"
  workflow_dispatch:
    inputs:
      columns:
        description: "Subset of C,D,E,F"
        default: "C,D,E,F"
      dry_run:
        description: "Compute only; do not write Sheet"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: qqscan-cdef
  cancel-in-progress: false

jobs:
  cdef:
    # Skip failed/cancelled Daily ExtraScan; still run on schedule + dispatch.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Screen → QQscan C/D/E/F
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXTRA=()
          COLS="C,D,E,F"
          echo "event=${{ github.event_name }} schedule='${{ github.event.schedule }}'"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "upstream=${{ github.event.workflow_run.name }} conclusion=${{ github.event.workflow_run.conclusion }} run_id=${{ github.event.workflow_run.id }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COLS="${{ inputs.columns }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA+=(--dry-run); fi
          fi
          # schedule backups and workflow_run both skip if this session was already written
          # (a skipped Daily ExtraScan still concludes success and would otherwise re-write).
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_run" ]; then
            EXTRA+=(--skip-if-primary-done)
          fi
          python write_qqscan_cdef.py --columns "$COLS" --out-json cdef_result.json "${EXTRA[@]}"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqscan_cdef_result
          path: cdef_result.json
          if-no-files-found: ignore
          retention-days: 14
