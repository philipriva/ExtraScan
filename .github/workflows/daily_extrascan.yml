name: Daily ExtraScan

on:
  schedule:
    # GitHub Actions cron is UTC only (no CRON_TZ).
    # Primary: 30 21 * * 1-5 ≈ Mon–Fri 17:30 America/New_York during EDT (UTC-4)
    # ≈ 06:30 JST Tue–Sat. During EST (UTC-5) this is 16:30 ET (close+30m).
    # Later than cash+15m so Yahoo daily bars usually show the session date;
    # run_extrascan also refuses Sheets write if last bar ≠ prior complete session.
    - cron: "30 21 * * 1-5"
    # Morning backups, staggered vs other full-universe Yahoo writers
    # (CDEF/Zhuli/us-exclude/Strong/Maggie). ~35 min job.
    # 12 22 * * 1-5 ≈ 07:12 JST Tue–Sat (early retry if 06:30 missed; queues
    # behind a still-running primary). 58 1 * * 2-6 ≈ 10:58 JST Tue–Sat.
    - cron: "12 22 * * 1-5"
    - cron: "58 1 * * 2-6"
    # Late backup: Tue–Sat 06:00 UTC ≈ 15:00 JST / 02:00 ET — Yahoo full-universe
    # bars often incomplete at the primary window (2026-10-29 schedule failed
    # freshness at ~01:05 UTC with frac~0.29; same-day manual ~06:25 UTC OK).
    # Anchor of the staggered late ladder (Pulse 15:10, CDEF 16:22, Zhuli 17:02,
    # us-exclude 17:42, Strong 18:22, Maggie 19:02).
    - cron: "0 6 * * 2-6"
  workflow_dispatch:
    inputs:
      etf_only:
        description: "Only scan ETF tabs (default curated etf_list.txt; skip ALL equities; do not clear ALL tabs)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-extrascan
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Skip if session already succeeded
        id: already
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 skip_if_session_done.py --workflow daily_extrascan.yml
      - uses: actions/setup-python@v5
        if: steps.already.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.already.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run ExtraScan
        if: steps.already.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.etf_only }}" = "true" ]; then
            EXTRA="--etf-only"
          fi
          python run_extrascan.py --out-dir out $EXTRA
      - name: Upload artifacts
        if: always() && steps.already.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extrascan_out
          path: out/
          retention-days: 14
