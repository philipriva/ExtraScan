name: Daily ExtraScan

on:
  schedule:
# Primary trigger is the 07:30 JST routine (workflow_dispatch), approved
# 2026-11-17 (Philip / 指原). Morning crons are an independent trigger
# layer approved by Philip 2026-11-26, not the sole clock; the dispatcher
# remains the timing guarantee. Midday backup cron is retained.
# Odd minutes, Tue–Sat, staggered so writers do not share a Yahoo pull.
# Skip-if-session-already-succeeded makes a later schedule trigger a no-op
# after a successful run. GitHub schedule has no SLA.
    # Morning trigger: 06:47 JST Tue–Sat = `47 21 * * 1-5` UTC.
    - cron: "47 21 * * 1-5"
    # Midday backup: 12:27 JST Tue–Sat = `27 3 * * 2-6` UTC.
    - cron: "27 3 * * 2-6"
  workflow_dispatch:
    inputs:
      etf_only:
        description: "Only scan ETF tabs (default curated etf_list.txt; skip ALL equities; do not clear ALL tabs)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-extrascan
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Skip if session already succeeded
        id: already
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 skip_if_session_done.py --workflow daily_extrascan.yml
      - uses: actions/setup-python@v5
        if: steps.already.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.already.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run ExtraScan
        if: steps.already.outputs.skip != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.etf_only }}" = "true" ]; then
            EXTRA="--etf-only"
          fi
          python run_extrascan.py --out-dir out $EXTRA
      - name: Upload artifacts
        if: always() && steps.already.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extrascan_out
          path: out/
          retention-days: 14
